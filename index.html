<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cutesy Memory Match</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #ffe4f1;
    --bg2: #e6e4ff;
    --card: #fffafc;
    --ink: #5b4a6b;
    --soft: #b8a7c9;
    --pink: #ff8fbf;
    --pink-soft: #ffd6e8;
    --blue-soft: #e3f4ff;
    --blue-ink: #4a8bbd;
    --shadow: 0 6px 0 rgba(214, 72, 138, 0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    padding: 20px;
  }
  .wrap {
    width: min(460px, 100%);
    background: var(--card);
    border-radius: 36px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(150, 100, 180, 0.25);
  }
  h1 {
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .sub {
    text-align: center;
    color: var(--soft);
    font-size: 14px;
    margin-bottom: 16px;
  }
  .levels {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .levels button {
    font-family: inherit;
    font-size: 14px;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    background: var(--blue-soft);
    color: var(--blue-ink);
    cursor: pointer;
  }
  .levels button.active { background: var(--pink); color: #fff; }
  .stats {
    display: flex;
    justify-content: space-between;
    background: #fff0f6;
    border-radius: 20px;
    padding: 10px 18px;
    margin-bottom: 16px;
    font-size: 15px;
  }
  .stats b { font-weight: 600; }
  .grid {
    display: grid;
    gap: 10px;
  }
  .tile {
    aspect-ratio: 1;
    perspective: 600px;
    cursor: pointer;
  }
  .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.45s cubic-bezier(.4,1.6,.6,1);
    transform-style: preserve-3d;
  }
  .tile.flipped .inner, .tile.matched .inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: var(--shadow);
  }
  .back {
    background: var(--pink-soft);
    color: var(--pink);
    font-size: 22px;
  }
  .front {
    background: #fff;
    transform: rotateY(180deg);
    font-size: clamp(24px, 8vw, 38px);
  }
  .tile.matched .front {
    background: #f1fff6;
    animation: pop 0.4s;
  }
  @keyframes pop {
    50% { transform: rotateY(180deg) scale(1.12); }
  }
  /* matched cards poof away but keep their spot */
  .tile.gone {
    pointer-events: none;
    animation: poof 0.45s forwards;
  }
  @keyframes poof {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }
  /* hard mode reshuffle wiggle */
  .tile.shuffling { animation: swirl 0.6s ease-in-out; }
  @keyframes swirl {
    0% { transform: scale(1) rotate(0); }
    50% { transform: scale(0.6) rotate(180deg); opacity: 0.5; }
    100% { transform: scale(1) rotate(360deg); }
  }
  .hard-note {
    text-align: center;
    font-size: 13px;
    color: var(--pink);
    margin: -6px 0 12px;
    min-height: 16px;
  }
  .tile.gone {
    pointer-events: none;
    animation: vanish 0.5s forwards;
  }
  @keyframes vanish {
    to { opacity: 0; transform: scale(0.3) rotate(15deg); }
  }
  .tile.shuffling .inner { animation: wiggle 0.5s; }
  @keyframes wiggle {
    25% { transform: scale(0.85) rotate(-8deg); }
    50% { transform: scale(0.85) rotate(8deg); }
    75% { transform: scale(0.9) rotate(-4deg); }
  }
  .rules {
    text-align: center;
    font-size: 13px;
    color: var(--pink);
    min-height: 18px;
    margin: -6px 0 12px;
  }
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 15px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .tile.shake .inner { animation: shake 0.35s; }
  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-5px); }
    75% { transform: rotateY(180deg) translateX(5px); }
  }
  .restart {
    display: block;
    margin: 18px auto 0;
    font-family: inherit;
    font-size: 16px;
    border: none;
    border-radius: 20px;
    padding: 12px 28px;
    background: var(--pink);
    color: #fff;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .restart:active { transform: translateY(3px); }

  /* win popup */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(91, 74, 107, 0.35);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .popup {
    background: var(--card);
    border-radius: 32px;
    padding: 28px 24px;
    text-align: center;
    width: min(320px, 100%);
    animation: rise 0.4s cubic-bezier(.4,1.6,.6,1);
  }
  @keyframes rise { from { transform: scale(0.7); opacity: 0; } }
  .popup .big { font-size: 52px; }
  .popup h2 { margin: 6px 0; font-weight: 600; }
  .popup p { color: var(--soft); margin: 4px 0; }
  .best { color: var(--pink) !important; font-weight: 500; }

  .confetti {
    position: fixed;
    top: -20px;
    font-size: 20px;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(540deg); }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>✿ memory match ✿</h1>
  <div class="sub">find all the cute pairs</div>

  <div class="levels">
    <button data-pairs="6">easy</button>
    <button data-pairs="8" class="active">medium</button>
    <button data-pairs="10">hard</button>
  </div>

  <div class="rules" id="rules"></div>

  <div class="hard-note" id="hardNote"></div>

  <div class="stats">
    <span>⏱ <b id="time">0:00</b></span>
    <span>👆 <b id="moves">0</b> moves</span>
    <span>💖 <b id="pairs">0/8</b></span>
  </div>

  <div class="grid" id="grid"></div>

  <button class="restart" id="restart">shuffle again</button>
</div>

<div class="toast" id="toast">🌀 shuffled!</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="big">🎉</div>
    <h2>you did it!</h2>
    <p id="result"></p>
    <p class="best" id="best"></p>
    <button class="restart" id="again">play again</button>
  </div>
</div>

<script>
  const EMOJIS = ['🌸','🍓','🐰','🌈','🧁','🦄','🍑','🐱','⭐','🍒','🐻','🌙'];

  const grid = document.getElementById('grid');
  const timeEl = document.getElementById('time');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const overlay = document.getElementById('overlay');

  let pairCount = 8;
  let first = null, second = null, locked = false;
  let moves = 0, matched = 0, seconds = 0, timer = null;
  let peekTimer = null;
  const isHard = () => pairCount === 10;
  const PEEK_MS = 1500; // how long the first card stays open in hard mode

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function fmt(s) {
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function startGame() {
    clearInterval(timer);
    clearTimeout(peekTimer);
    timer = null;
    first = second = null;
    document.getElementById('rules').textContent = isHard()
      ? '🔥 hard: be quick, wrong guesses reshuffle, matches vanish'
      : '';
    locked = false;
    moves = matched = seconds = 0;
    timeEl.textContent = '0:00';
    movesEl.textContent = '0';
    pairsEl.textContent = '0/' + pairCount;
    overlay.classList.remove('show');
    document.getElementById('hardNote').textContent =
      pairCount === 10 ? '🌀 hard mode: wrong guesses reshuffle the board!' : '';

    const picks = shuffle([...EMOJIS]).slice(0, pairCount);
    const deck = shuffle([...picks, ...picks]);

    grid.style.gridTemplateColumns = 'repeat(' + (pairCount === 6 ? 3 : 4) + ', 1fr)';
    if (pairCount === 10) grid.style.gridTemplateColumns = 'repeat(5, 1fr)';

    grid.innerHTML = '';
    deck.forEach(emoji => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.emoji = emoji;
      tile.innerHTML =
        '<div class="inner">' +
          '<div class="face back">✿</div>' +
          '<div class="face front">' + emoji + '</div>' +
        '</div>';
      tile.addEventListener('click', () => flip(tile));
      grid.appendChild(tile);
    });
  }

  function flip(tile) {
    if (locked || tile === first || tile.classList.contains('matched')) return;

    if (!timer) {
      timer = setInterval(() => { seconds++; timeEl.textContent = fmt(seconds); }, 1000);
    }

    tile.classList.add('flipped');

    if (!first) {
      first = tile;
      // hard mode: the first card flips back if you're too slow
      if (isHard()) {
        peekTimer = setTimeout(() => {
          if (first === tile && !second) {
            tile.classList.remove('flipped');
            first = null;
          }
        }, PEEK_MS);
      }
      return;
    }

    clearTimeout(peekTimer);
    second = tile;
    moves++;
    movesEl.textContent = moves;
    locked = true;

    if (first.dataset.emoji === second.dataset.emoji) {
      const a = first, b = second;
      a.classList.add('matched');
      b.classList.add('matched');
      matched++;
      pairsEl.textContent = matched + '/' + pairCount;
      first = second = null;
      locked = false;
      // let the pop play, then make the pair disappear
      setTimeout(() => { a.classList.add('gone'); b.classList.add('gone'); }, 450);
      if (matched === pairCount) setTimeout(win, 900);
    } else {
      first.classList.add('shake');
      second.classList.add('shake');
      setTimeout(() => {
        first.classList.remove('flipped', 'shake');
        second.classList.remove('flipped', 'shake');
        first = second = null;
        if (pairCount === 10) {
          // wait for the flip back to finish, then reshuffle
          setTimeout(reshuffle, 450);
        } else {
          locked = false;
        }
      }, 800);
    }
  }

  // hard mode: mix up every card that's still on the board
  function reshuffle() {
    const remaining = [...grid.querySelectorAll('.tile:not(.matched)')];
    const emojis = shuffle(remaining.map(t => t.dataset.emoji));

    remaining.forEach(t => t.classList.add('shuffling'));

    // swap the emojis halfway through the swirl so nobody can peek
    setTimeout(() => {
      remaining.forEach((t, i) => {
        t.dataset.emoji = emojis[i];
        t.querySelector('.front').textContent = emojis[i];
      });
    }, 300);

    setTimeout(() => {
      remaining.forEach(t => t.classList.remove('shuffling'));
      locked = false;
    }, 600);
  }

  function win() {
    clearInterval(timer);
    document.getElementById('result').textContent =
      moves + ' moves in ' + fmt(seconds);

    // best score saved per level (wrapped in try in case storage is blocked)
    const key = 'memory-best-' + pairCount;
    let msg = '';
    try {
      const best = JSON.parse(localStorage.getItem(key));
      if (!best || moves < best.moves || (moves === best.moves && seconds < best.seconds)) {
        localStorage.setItem(key, JSON.stringify({ moves, seconds }));
        msg = '✨ new best score! ✨';
      } else {
        msg = 'best: ' + best.moves + ' moves in ' + fmt(best.seconds);
      }
    } catch (e) {}
    document.getElementById('best').textContent = msg;

    overlay.classList.add('show');
    confetti();
  }

  function confetti() {
    const bits = ['🌸','💖','✨','⭐','🎀'];
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = bits[Math.floor(Math.random() * bits.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDuration = 2 + Math.random() * 2 + 's';
      c.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4500);
    }
  }

  document.querySelectorAll('.levels button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.levels button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      pairCount = Number(btn.dataset.pairs);
      startGame();
    });
  });

  document.getElementById('restart').addEventListener('click', startGame);
  document.getElementById('again').addEventListener('click', startGame);

  startGame();
</script>
</body>
</html>
